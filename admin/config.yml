backend:
  name: git-gateway
  branch: main # Branch to update (defaults to master)

# When using the git gateway backend, you can publish to your GitHub repo
# If you want to use GitHub directly, change git-gateway to github and add 
# your repo and auth settings

# Enable local development
local_backend: true

# These lines should match the media folder structure of your site
media_folder: "images" # Your existing images folder
public_folder: "images" # The public path to your images

# Example Netlify CMS config for gallery collection
collections:
  - name: "gallery"
    label: "Gallery Items"
    folder: "_gallery"
    create: true
    fields:
      - {label: "ID", name: "id", widget: "string"}
      - {label: "Title (English)", name: "title", widget: "string"}
      - {label: "Title (Spanish)", name: "title_es", widget: "string", required: false}
      - {label: "Year", name: "year", widget: "string"}
      - {label: "Category", name: "category", widget: "select", options: ["art", "design", "workshops", "texts", "experiments"]}
      - {label: "Thumbnail", name: "thumbnail", widget: "image"}
      - {label: "Images", name: "images", widget: "list", field: {label: Image, name: image, widget: image}}
      - {label: "Symbols", name: "symbols", widget: "text", required: false}
      - {label: "Decoration", name: "decoration", widget: "text", required: false}
      - {label: "Description (English)", name: "body", widget: "markdown"}
      - {label: "Description (Spanish)", name: "description_es", widget: "markdown", required: false}
  
  - name: "blog"
    label: "Blog Posts"
    folder: "_blog"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "ID", name: "id", widget: "string"}
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Language", name: "language", widget: "select", options: ["en", "es", "both"], default: "en", hint: "Select the language(s) this post should appear in"}
      - {label: "Thumbnail", name: "thumbnail", widget: "image", required: false}
      - {label: "Content", name: "content", widget: "markdown"}