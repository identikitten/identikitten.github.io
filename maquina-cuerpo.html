<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuerpo Fantasmado</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/tachyons@4.12.0/css/tachyons.min.css"/>

    <style>
        .body{
            background-color: rgba(255, 13, 13, 0.688);
        }
        .card-box {
            height: 100vh;
            position: relative;
            background-color: rgb(255, 13, 13);
        }
        .random-button {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            padding: 20px 40px;
            font-size: 18px;
            background-color: rgba(255, 13, 13, 0.688);
            color: black;
            box-shadow: inset 0px 0px 10px 3px #f28b8b;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            border: 0px;
            color: gold;
        }
        .random-button:hover {
            box-shadow: inset 0px 0px 10px 3px #f28b8b;
            color: rgb(240, 186, 186);
        }
        
        /* Mobile positioning - center button in viewport */
        @media (max-width: 768px) {
            .random-button {
                position: fixed;
                top: 50vh;
                left: 50vw;
                transform: translate(-50%, -50%);
            }
        }
        /* Center content in card containers */
        .card-left,
        .card-right {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
        }
        
        .card-left img,
        .card-right img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        
        /* SVG styling - make strokes red and thicker */
        .card-left svg,
        .card-right svg {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            transform: scale(1.1); /* Make text 1.5x bigger - adjust this value as needed */
            transform-origin: center center;
        }
        
        /* Hide polylines (connecting lines) */
        .card-left svg polyline,
        .card-right svg polyline {
            display: none !important;
        }
        
        /* Hide bounding boxes and structural elements */
        .card-left svg rect,
        .card-left svg circle,
        .card-left svg ellipse,
        .card-left svg polygon,
        .card-left svg line,
        .card-right svg rect,
        .card-right svg circle,
        .card-right svg ellipse,
        .card-right svg polygon,
        .card-right svg line {
            display: none !important;
            visibility: hidden !important;
        }
        
        /* Style only paths (the actual text/characters including strikethroughs) */
        .card-left svg path,
        .card-right svg path {
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            stroke: red !important;
            stroke-width: 2;
            fill: none !important;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        /* Text styling for bodily functions */
        .card-left .text-content,
        .card-right .text-content {
            font-size: 100px;
            color: gold;
            text-align: center;
            font-family: sans-serif;
        }
        
        /* SVG text animation */
        .card-left svg text,
        .card-right svg text {
            font-size: 100px;
            fill: none;
            stroke: gold;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        /* Animation for path drawing effect */
        @keyframes drawPath {
            to {
                stroke-dashoffset: 0;
            }
        }
        
        @keyframes drawText {
            to {
                stroke-dashoffset: 0;
            }
        }
        
        @keyframes revealChar {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .char-reveal {
            display: inline-block;
            opacity: 0;
            animation: revealChar 0.1s ease-in-out forwards;
        }
    </style>
</head>
<body>

<div class="list-element flex flex-wrap tc card-box">
    <div class="w-100 h-50 shadow">
        <div class="card-left ph4 pt5">
            <!-- SVG will be loaded here dynamically -->
        </div>
    </div>
    <div class="w-100 h-50 shadow">
        <div class="card-right pa4 pt5">
            <!-- SVG will be loaded here dynamically -->
        </div>
    </div>
</div>

<button class="random-button" id="randomImageButton">Una máquina que:</button>

<script>
    // NOTE: If you get CORS errors when opening this file directly (file:// protocol),
    // run a local server instead. Options:
    // - Python: python -m http.server 8000 (then visit http://localhost:8000/cuerpo-fantasmado.html)
    // - Node: npx http-server (then visit http://localhost:8080/cuerpo-fantasmado.html)
    // - VS Code: Use the "Live Server" extension
    
    const bodilyFunctions = [
        'Sueñe',
        'Se canse',
        'Juegue',
        'Sienta frío',
        'Muera',
        'Llore',
        'Se queje',
        'Suspire',
        'Mastique',
        'Tiemble',
        'Respire',
        'Eructe',
        'Ría',
        'Huela',
        'Sienta hambre',
        'Se peturbe',
        'Gesticule',
        'Digiera'
    ];

    // Get references to DOM elements
    const leftCardContainer = document.querySelector('.card-left');
    const rightCardContainer = document.querySelector('.card-right');
    const randomButton = document.getElementById('randomImageButton');

    // Function to get a random text from the array
    function getRandomText() {
        const randomIndex = Math.floor(Math.random() * bodilyFunctions.length);
        return bodilyFunctions[randomIndex];
    }

    // Function to get path length for proper animation
    function getPathLength(path) {
        if (path.getTotalLength) {
            return path.getTotalLength();
        }
        return 1000; // fallback value
    }

    // Function to style and animate SVG paths
    function styleSVGPaths(svgElementOrDoc, delay = 0) {
        if (!svgElementOrDoc) return;
        
        // Handle both SVG element and document - both support querySelectorAll
        const container = svgElementOrDoc;
        
        // Remove stroke colors from groups and other containers that might affect child elements
        const groups = container.querySelectorAll('g');
        groups.forEach(group => {
            group.removeAttribute('stroke');
            group.style.stroke = 'none';
        });
        
        // Hide all polylines (connecting lines)
        const polylines = container.querySelectorAll('polyline');
        polylines.forEach(polyline => {
            polyline.style.display = 'none';
        });
        
        // Hide bounding boxes and structural elements (rect, circle, ellipse, polygon)
        const rects = container.querySelectorAll('rect');
        rects.forEach(rect => {
            rect.style.display = 'none';
        });
        
        const circles = container.querySelectorAll('circle');
        circles.forEach(circle => {
            circle.style.display = 'none';
        });
        
        const ellipses = container.querySelectorAll('ellipse');
        ellipses.forEach(ellipse => {
            ellipse.style.display = 'none';
        });
        
        const polygons = container.querySelectorAll('polygon');
        polygons.forEach(polygon => {
            polygon.style.display = 'none';
        });
        
        // Hide lines that aren't part of the actual text paths
        const lines = container.querySelectorAll('line');
        lines.forEach(line => {
            line.style.display = 'none';
        });
        
        // Style and animate ALL paths (the actual text/characters including strikethroughs)
        // Make sure we get ALL paths, including those in nested groups
        const paths = container.querySelectorAll('path');
        paths.forEach((path, index) => {
            // Make sure path is visible
            path.style.display = '';
            path.style.visibility = 'visible';
            path.style.opacity = '1';
            
            // Aggressively force red - override any CSS, classes, or inline styles
            path.removeAttribute('stroke');
            path.removeAttribute('class');
            path.setAttribute('stroke', 'red');
            path.style.stroke = 'red';
            path.style.strokeColor = 'red';
            path.style.color = 'red';
            path.style.setProperty('stroke', 'red', 'important');
            
            // Ensure fill is none
            path.setAttribute('fill', 'none');
            path.style.fill = 'none';
            
            // Set stroke width
            path.setAttribute('stroke-width', '4');
            path.style.strokeWidth = '4';
            
            // Set stroke line properties
            path.setAttribute('stroke-linecap', 'round');
            path.setAttribute('stroke-linejoin', 'round');
            
            // Calculate path length for animation
            const length = getPathLength(path);
            if (length > 0) {
                path.style.strokeDasharray = length;
                path.style.strokeDashoffset = length;
                
                // Animate with stagger delay
                const animationDelay = delay + (index * 0.15);
                path.style.animation = `drawPath ${2 + Math.random()}s ease-in-out ${animationDelay}s forwards`;
            } else {
                // If path has no length, make it visible immediately
                path.style.strokeDasharray = 'none';
                path.style.strokeDashoffset = '0';
            }
        });
    }

    // SVG content cache - will be populated as SVGs are loaded
    const svgCache = {};

    // Function to load SVG content - works with both file:// and http://
    function loadSVGContent(url) {
        return new Promise((resolve) => {
            // Check cache first
            if (svgCache[url]) {
                resolve(svgCache[url]);
                return;
            }

            // Try XMLHttpRequest first (works in some cases with file://)
            const xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200 || xhr.status === 0) {
                        // Status 0 can occur with file:// protocol
                        svgCache[url] = xhr.responseText;
                        resolve(xhr.responseText);
                    } else {
                        // If XMLHttpRequest fails, try object tag method
                        loadSVGViaObject(url).then(resolve);
                    }
                }
            };
            
            try {
                xhr.send();
            } catch (e) {
                // If XMLHttpRequest fails, try object tag method
                loadSVGViaObject(url).then(resolve);
            }
        });
    }

    // Alternative: Load SVG via object tag and extract content
    function loadSVGViaObject(url) {
        return new Promise((resolve) => {
            const tempContainer = document.createElement('div');
            tempContainer.style.position = 'absolute';
            tempContainer.style.left = '-9999px';
            tempContainer.style.visibility = 'hidden';
            document.body.appendChild(tempContainer);

            const object = document.createElement('object');
            object.type = 'image/svg+xml';
            object.data = url;
            object.style.width = '1px';
            object.style.height = '1px';

            object.onload = function() {
                try {
                    const svgDoc = object.contentDocument;
                    if (svgDoc) {
                        const svgElement = svgDoc.documentElement;
                        const svgContent = new XMLSerializer().serializeToString(svgElement);
                        svgCache[url] = svgContent;
                        document.body.removeChild(tempContainer);
                        resolve(svgContent);
                    } else {
                        document.body.removeChild(tempContainer);
                        resolve(null);
                    }
                } catch (e) {
                    document.body.removeChild(tempContainer);
                    resolve(null);
                }
            };

            object.onerror = function() {
                document.body.removeChild(tempContainer);
                resolve(null);
            };

            tempContainer.appendChild(object);
            
            // Timeout fallback
            setTimeout(() => {
                if (tempContainer.parentNode) {
                    document.body.removeChild(tempContainer);
                    resolve(null);
                }
            }, 2000);
        });
    }

    // Function to create SVG text with animation
    function createAnimatedText(text) {
        // Create SVG element
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('width', '100%');
        svg.setAttribute('height', '150');
        svg.setAttribute('viewBox', '0 0 1200 150');
        svg.style.display = 'block';
        svg.style.margin = '0 auto';
        
        // Create text element
        const textElement = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        textElement.setAttribute('x', '50%');
        textElement.setAttribute('y', '50%');
        textElement.setAttribute('dominant-baseline', 'middle');
        textElement.setAttribute('text-anchor', 'middle');
        textElement.setAttribute('font-size', '100');
        textElement.setAttribute('font-family', 'sans-serif');
        textElement.setAttribute('fill', 'none');
        textElement.setAttribute('stroke', 'gold');
        textElement.setAttribute('stroke-width', '4');
        textElement.setAttribute('stroke-linecap', 'round');
        textElement.setAttribute('stroke-linejoin', 'round');
        textElement.textContent = text;
        
        svg.appendChild(textElement);
        
        // Animate the text - estimate stroke length based on text length
        // For 100px font, average character width is approximately 60px
        // We multiply by a larger factor to account for stroke path complexity and ensure completion
        // Using a much larger estimate to ensure the animation completes fully
        const estimatedLength = text.length * 120;
        textElement.style.strokeDasharray = estimatedLength;
        textElement.style.strokeDashoffset = estimatedLength;
        const animationDuration = 2 + Math.random() * 1;
        textElement.style.animation = `drawText ${animationDuration}s ease-in-out forwards`;
        
        return svg;
    }
    
    // Function to display text with animation
    function displayText(container, text) {
        container.innerHTML = '';
        const svg = createAnimatedText(text);
        container.appendChild(svg);
    }

    // Function to shuffle both texts - ensures they're never the same
    function shuffleBothTexts() {
        // Get random texts for both cards, ensuring they're different
        let randomLeftText = getRandomText();
        let randomRightText = getRandomText();
        
        // Keep picking until they're different
        while (randomLeftText === randomRightText && bodilyFunctions.length > 1) {
            randomRightText = getRandomText();
        }
        
        // Update both texts with fade transition
        leftCardContainer.style.opacity = '0';
        rightCardContainer.style.opacity = '0';
        
        setTimeout(() => {
            displayText(leftCardContainer, randomLeftText);
            displayText(rightCardContainer, randomRightText);
            
            setTimeout(() => {
                leftCardContainer.style.transition = 'opacity 0.5s ease';
                rightCardContainer.style.transition = 'opacity 0.5s ease';
                leftCardContainer.style.opacity = '1';
                rightCardContainer.style.opacity = '1';
            }, 10);
        }, 10);
    }

    // Initialize with first texts - ensure they're different
    window.addEventListener('DOMContentLoaded', () => {
        const leftText = bodilyFunctions[0];
        const rightText = bodilyFunctions.length > 1 ? bodilyFunctions[1] : bodilyFunctions[0];
        displayText(leftCardContainer, leftText);
        displayText(rightCardContainer, rightText);
    });

    // Add event listener to the button
    randomButton.addEventListener('click', shuffleBothTexts);

    // Optional: Allow keyboard spacebar to trigger shuffle
    document.addEventListener('keydown', function(event) {
        if (event.code === 'Space') {
            event.preventDefault();
            shuffleBothTexts();
        }
    });
</script>

</body>
</html>
